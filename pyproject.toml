[project]
name = "service-google-doc-ai"
version = "0.1.0"
description = "POC API for Thai expense document OCR, classification, and extraction"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "google-cloud-documentai>=3.6,<4",
    "google-genai>=1.45,<2",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
